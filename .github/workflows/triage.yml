# Welcome new sprint issues (links to the calendar and the scheduler) and add the labels
# matching the sprint type and working groups chosen in the issue form.
name: Welcome new sprints

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      refresh:
        description: Post or refresh the welcome comment on every open issue (e.g. after enabling the scheduler)
        type: boolean
        default: true

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Label and welcome
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ISSUE: ${{ github.event.issue.number }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REFRESH" = "true" ]; then python -m sprintweek triage --all --greet; else python -m sprintweek triage --all; fi
          elif [ "$ACTION" = "opened" ]; then
            python -m sprintweek triage --issue "$ISSUE" --greet
          else
            python -m sprintweek triage --issue "$ISSUE"
          fi
