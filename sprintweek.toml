# Configuration for the Sprint Week calendar.
# For a new Sprint Week this is normally the only file that needs editing
# (plus the dropdown options in .github/ISSUE_TEMPLATE/sprint.yml).

[event]
title = "DESC Sprint Week 2026"
start_date = 2026-10-26 # first day, inclusive
end_date = 2026-10-30   # last day, inclusive
# Time zone shown to first-time visitors: "local" (the viewer's own clock),
# a site name from below, or an IANA zone such as "Europe/Paris".
default_timezone = "local"

# Physical sites. A session scheduled at a site uses that site's time zone.
# Rooms are suggestions in the scheduling form; people can also type their own.
[[sites]]
name = "SLAC"
timezone = "America/Los_Angeles"
rooms = ["Redwood A", "Redwood B", "Redwood C-D", "KFB 2nd floor conference room"]

[[sites]]
name = "Paris"
timezone = "Europe/Paris"
rooms = []

[github]
# Repository whose issues are the sprints.
# Defaults to the repository running the GitHub Action ($GITHUB_REPOSITORY).
repo = "jfcrenshaw/desc-sprint-website-demo"
# Issues carrying any of these labels are left off the website.
exclude_labels = ["duplicate", "invalid", "wontfix", "not a sprint"]
# Post a welcome comment (calendar + scheduling links) on every new sprint issue.
greet_new_issues = true
# Add the labels matching the "Sprint type" and "Working groups" chosen in the form.
# Only labels that already exist in the repository are added.
auto_label = true

[scheduler]
# Public URL of the scheduling bot (the Cloudflare Worker in worker/).
# Leave empty until the bot is deployed; scheduling links are hidden until then.
url = "https://sprintweek-scheduler.sprintweek-scheduler.workers.dev"
# GitHub login of the bot that posts session comments: "<github-app-slug>[bot]".
bot_login = "desc-sprint-week-demo-bot[bot]"
# Members of this GitHub organization may add sessions to any sprint.
# Editing or cancelling a sprint's sessions is limited to its author, assignees,
# @mentioned contacts, the person who created the session, and repo collaborators.
org = "LSSTDESC"

[site]
# Public URL of the calendar. Defaults to https://<owner>.github.io/<repo>/.
url = ""

# Calendar colors for each sprint type.
# The names must match the "Sprint type" options in the issue form.
[types]
"General Sprint" = "#2f6fdf"
"Infrastructure Sprint" = "#0f8a7e"
"Service Sprint" = "#c26a1b"
"Paper Sprint" = "#8250df"
"Tutorial" = "#c93a6b"
"Other" = "#5c6773"
