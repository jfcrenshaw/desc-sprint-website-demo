- source: 58
  title: Expand and improve Dark Energy Exploration Dashboard visualization aspect
  pitch: DEED has a prototype implementation of its visualization aspect that we'd like to make usable for the larger community.
  contacts: Leo Sajkov
  type: General Sprint
  working_groups:
  - MCP (Modelling and Combined Probes)
  options:
  - New contributor friendly
  goals: |-
    - A stable visualization interface that can take a variety of inputs (data vectors, MCMC chains, etc.) and produce the appropriate plots
    - Overplot inputs from different data products
    - Reach goal: make the plots interactive, to allow for easily comparing between different data products
  prerequisites: Most of this project is vibe-coding, so enthusiasm and creativity with regard to visualizing data products is most useful!
  links: |-
    Slack: #desc-de-dashboard
    Repo: https://github.com/LSSTDESC/DEED
  details: DEED's visualization aspect is built to flexibly plot different data products that are either stored in the Data Registry or passed as input by the user. This aspect becomes most powerful when it can overplot multiple data products so that they can be compared. Paired with good data provenance, this becomes a great way of understanding how choices in modeling, data, assumptions, etc., propagate into results.
