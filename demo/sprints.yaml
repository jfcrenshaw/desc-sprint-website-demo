- source: 18
  title: Develop non-Gaia star masking for DP2
  pitch: Develop masking for relatively bright stars that goes beyond the Gaia catalog, since a Gaia-based selection will be incomplete in redder bands.
  contacts: Theo Schutt
  type: General Sprint
  working_groups:
  - PO (Pixels to Objects)
  options:
  - New contributor friendly
  goals: |-
    1. Produce a high-purity catalog of stars to mask beyond what is already in Gaia (likely using morphology/object classification already in the DP2 object catalog)
    2. Determine how dim of stars we need to mask for the shear catalog
    3. Determine the minimum radius for this masking
    4. Produce a mask suitable for TXPipe, etc.
  prerequisites: Accessing DP2 catalogs, general exploratory analysis plotting, etc.
  links: 'Slack: #desc-dp2-shear'
  details: Related work on masking stars in the Gaia catalog down to G=20 is tracked in https://github.com/LSSTDESC/dp2_static_catalog_production/issues/29 and https://github.com/LSSTDESC/dp2_static_catalog_production/issues/31. Generally around all week at SLAC; remote contributions are also welcome!

