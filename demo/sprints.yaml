# Demo content for the prototype.
#
# Titles and descriptions are copied (lightly trimmed) from LSSTDESC/SprintWeek2026.
# Sessions are representative structured versions of each issue's free-text "Day/Time".
# demo/seed.py turns this file into GitHub issues + session comments, or into an offline
# snapshot (demo/snapshot.json) used by the tests and for local previews.
# @mentions and links to other repositories' issues are neutralized by seed.py so that
# creating the demo never notifies anyone or adds backlinks to other repositories.
#
# Session fields: date, start, end (24-hour), tz (IANA zone), and optionally site,
# location, online ("zoom" means the placeholder link below), label, note.

