<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprint Week Presenter</title>
  <meta name="description" content="Pitch and wrap-up slides generated from the Sprint Week GitHub issues.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎤%3C/text%3E%3C/svg%3E">
  <script>try { const t = localStorage.getItem('sprintweek:theme'); if (t) document.documentElement.dataset.theme = t; } catch { /* private mode */ }</script>
  <link rel="stylesheet" href="assets/style.css">
  <script src="vendor/marked.umd.js" defer></script>
  <script src="vendor/purify.min.js" defer></script>
  <script type="module" src="assets/present.js"></script>
</head>
<body class="present-page">
  <div id="setup" class="setup">
    <p class="setup-top"><a href="./">← Back to the calendar</a><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false"><span class="theme-knob" aria-hidden="true"><svg class="icon-sun" viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg><svg class="icon-moon" viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg></span></button></p>
    <h1 id="setup-title">Present</h1>
    <form id="setup-form" class="setup-form">
      <fieldset>
        <legend>What are you presenting?</legend>
        <label class="choice"><input type="radio" name="mode" value="pitch" checked> <span><strong>Morning pitches</strong><br><span class="muted">One slide per sprint meeting that day: pitch, contacts, sessions.</span></span></label>
        <label class="choice"><input type="radio" name="mode" value="wrapup"> <span><strong>Wrap-ups</strong><br><span class="muted">One slide per wrap-up posted for that day, grouped by sprint.</span></span></label>
      </fieldset>
      <div class="setup-row">
        <label>Day <select name="day" id="day"></select></label>
        <label>Times in <select name="tz" id="tz"></select></label>
      </div>
      <label class="check" id="unscheduled-row"><input type="checkbox" name="unscheduled" checked> Also show sprints that are not scheduled yet (at the end)</label>
      <div class="setup-row">
        <button class="btn primary big" type="submit">▶ Start presenting</button>
        <span class="muted" id="slide-count"></span>
      </div>
    </form>
    <p class="muted keys">Keys: <kbd>→</kbd> or <kbd>Space</kbd> next · <kbd>←</kbd> back · <kbd>F</kbd> full screen · <kbd>Esc</kbd> back to this page. Clickers work too.</p>
    <ol id="setup-list" class="setup-list"></ol>
  </div>

  <div id="deck" class="deck" hidden>
    <div id="slide" class="slide-frame" aria-live="polite"></div>
    <div class="deck-bar">
      <button type="button" class="btn small ghost" id="prev" aria-label="Previous slide">←</button>
      <span id="counter"></span>
      <button type="button" class="btn small ghost" id="next" aria-label="Next slide">→</button>
      <button type="button" class="btn small ghost" id="full" aria-label="Full screen">⛶</button>
      <button type="button" class="btn small ghost" id="exit" aria-label="Exit">✕</button>
    </div>
  </div>
</body>
</html>
