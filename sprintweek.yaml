# Configuration for the Sprint Week calendar.
# For a new Sprint Week this is normally the only file that needs editing
# (plus the dropdown options in .github/ISSUE_TEMPLATE/sprint.yml).
#
# Edit it directly on GitHub (pencil icon); the calendar rebuilds about a minute after
# you commit. If something is wrong, the build stops with a message saying which line to
# fix, and the website keeps showing the previous version.
#
# YAML tips: quote colors ("#2f6fdf"), because an unquoted # starts a comment.
# Dates are YYYY-MM-DD and times are 24-hour HH:MM.

event:
  title: DESC Sprint Week 2026
  start_date: 2026-10-26 # first day, inclusive
  end_date: 2026-10-30 # last day, inclusive
  # Time zone shown to first-time visitors: "local" (the viewer's own clock),
  # a site name from below, or an IANA zone such as Europe/Paris.
  default_timezone: local
  # Optional one-line banner at the top of the calendar (Markdown links allowed).
  # Delete it for a real Sprint Week.
  notice: "**Demo.** The sprints are copies of real SprintWeek2026 issues; some of their session times and the Paris program are made up for the demo. Try it: [propose a test sprint](https://github.com/jfcrenshaw/desc-sprint-website-demo/issues/new?template=sprint.yml), schedule a session on it and post a wrap-up."

# Physical sites. Sessions and program items at a site use that site's time zone.
#
# info: optional Markdown page about the site (access, Wi-Fi, food, contacts), shown as
#   a "<site> info" tab. Keep it in a folder such as site-info/; images and files next to
#   it can be linked with relative paths, e.g. ![map](slac-map.png).
#
# rooms: suggestions in the scheduling form (people can still type their own room).
#   A plain name is available all week. To restrict a room, give it "available" windows:
#     days: all, weekday names (Mon, Tue, ...) or dates (2026-10-27), as a list
#     start, end: optional hours; leave both out for the whole day, give only end
#                 for "until" (e.g. end: 13:00) or only start for "from"
#   The scheduling form only suggests rooms open on the chosen day, and the bot refuses
#   sessions in a listed room outside its windows. If you change availability after people
#   have scheduled, sessions now outside it are flagged on the website and the sprint gets
#   an automatic comment asking to pick another room (marked resolved once it moves).
#
# program: the organizers' schedule at that site.
#   title     what it is
#   kind      break | meal | plenary | social
#             Breaks and meals are shaded bands behind the sprint sessions, shown when the
#             viewer's clock matches the site's. Plenaries (and anything with an online link)
#             are shown to everyone and included in the calendar feed.
#   days      all, weekday names or dates, as for rooms
#   start, end
#   location, online (https:// link), note: optional
#
# NOTE: the SLAC rooms and program below are the real 2026 ones; the Paris program is
# illustrative demo data.
sites:
  - name: SLAC
    timezone: America/Los_Angeles
    info: site-info/slac.md # Markdown page shown as the "SLAC info" tab
    rooms:
      - name: Redwoods A-B
        available:
          - days: [Wed, Thu, Fri]
      - Redwoods C-D
      - name: FKB 2nd floor conference room
        available:
          - days: [Mon, Wed, Thu]
          - days: [Fri]
            end: 13:00 # until 1pm
      - name: FKB 3rd floor conference room
        available:
          - days: [Wed]
      - name: B53 Tulare
        available:
          - days: [Mon, Tue, Fri]
      - name: B53 Yosemite
        available:
          - days: [Mon, Tue]
      - name: B53 Toluca
        available:
          - days: [Tue, Thu, Fri]
    program:
      - title: Morning sprint pitches
        kind: plenary
        days: all
        start: 09:00
        end: 10:00
        location: FKB auditorium
        online: https://zoom.us/j/0000000000
        note: Two minutes per sprint; slides come from the GitHub issues.
      - title: Coffee
        kind: break
        days: [Mon, Tue]
        start: 08:30
        end: 09:00
        location: Outside the FKB auditorium
      - title: Coffee
        kind: break
        days: [Wed, Thu, Fri]
        start: 08:30
        end: 09:00
        location: Redwoods patio
      - title: Lunch
        kind: meal
        days: [Mon, Tue]
        start: 12:00
        end: 13:00
        location: Outside the FKB auditorium
      - title: Lunch
        kind: meal
        days: [Wed, Thu, Fri]
        start: 12:00
        end: 13:00
        location: Redwoods patio
      - title: Afternoon snacks
        kind: break
        days: [Mon, Tue]
        start: 15:30
        end: 16:00
        location: Outside the FKB auditorium
      - title: Afternoon snacks
        kind: break
        days: [Wed, Thu, Fri]
        start: 15:30
        end: 16:00
        location: Redwoods patio
      - title: Welcome reception
        kind: social
        days: [Mon]
        start: 17:00
        end: 19:00
        location: Redwoods patio

  - name: Paris
    timezone: Europe/Paris
    info: site-info/paris.md
    rooms: []
    program:
      - title: Coffee
        kind: break
        days: all
        start: 10:30
        end: 11:00
      - title: Lunch
        kind: meal
        days: all
        start: 12:30
        end: 14:00
      - title: Coffee
        kind: break
        days: all
        start: 16:00
        end: 16:30
      - title: Welcome drinks
        kind: social
        days: [Mon]
        start: 18:00
        end: 20:00

github:
  # Repository whose issues are the sprints.
  # Defaults to the repository running the GitHub Action ($GITHUB_REPOSITORY).
  repo: jfcrenshaw/desc-sprint-website-demo
  # Issues carrying any of these labels are left off the website.
  exclude_labels: [duplicate, invalid, wontfix, not a sprint]
  # Post a welcome comment (calendar + scheduling links) on every new sprint issue.
  greet_new_issues: true
  # Add the labels matching the "Sprint type" and "Working groups" chosen in the form.
  # Only labels that already exist in the repository are added.
  auto_label: true

scheduler:
  # Public URL of the scheduling bot (the Cloudflare Worker in worker/).
  # Leave empty until the bot is deployed; scheduling links are hidden until then.
  url: https://sprintweek-scheduler.sprintweek-scheduler.workers.dev
  # GitHub login of the bot that posts session comments: "<github-app-slug>[bot]".
  bot_login: desc-sprint-week-demo-bot[bot]
  # Members of this GitHub organization may add sessions to any sprint.
  # Editing or cancelling a sprint's sessions is limited to its author, assignees,
  # @mentioned contacts, the person who created the session, and repo collaborators.
  org: LSSTDESC

site:
  # Public URL of the calendar. Leave empty for https://<owner>.github.io/<repo>/.
  url: ""

# Calendar colors for each sprint type (quoted!).
# The names must match the "Sprint type" options in the issue form.
types:
  General Sprint: "#2f6fdf"
  Infrastructure Sprint: "#0f8a7e"
  Service Sprint: "#c26a1b"
  Paper Sprint: "#8250df"
  Tutorial: "#c93a6b"
  Other: "#5c6773"
